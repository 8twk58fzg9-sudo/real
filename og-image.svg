<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Computrax e-shop">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="0.52" stop-color="#0b1224"/>
      <stop offset="1" stop-color="#102448"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="5" fill="#3b82f6"/>
  <circle cx="910" cy="170" r="220" fill="#1d4ed8" opacity="0.18"/>
  <circle cx="210" cy="470" r="180" fill="#22c55e" opacity="0.09"/>
  <g filter="url(#shadow)">
    <rect x="70" y="82" width="560" height="468" rx="28" fill="#0f172a" stroke="#2b3a57" stroke-width="3"/>
    <text x="105" y="175" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="800" fill="#f8fafc">Computrax</text>
    <text x="107" y="228" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="600" fill="#9fb0cc">PC zostavy, komponenty a servis</text>
    <text x="107" y="285" font-family="Inter, Arial, sans-serif" font-size="25" fill="#cbd5e1">Automatický sklad, objednávky a</text>
    <text x="107" y="322" font-family="Inter, Arial, sans-serif" font-size="25" fill="#cbd5e1">bezpečné zákaznícke konto.</text>
    <rect x="105" y="410" width="220" height="58" rx="18" fill="url(#accent)"/>
    <text x="132" y="448" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff">Pozrieť ponuku</text>
    <rect x="350" y="410" width="160" height="58" rx="18" fill="#16a34a"/>
    <text x="383" y="448" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff">Skladom</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="705" y="125" width="420" height="330" rx="30" fill="#121c30" stroke="#36527e" stroke-width="3"/>
    <rect x="770" y="178" width="290" height="166" rx="16" fill="#22314f"/>
    <rect x="795" y="204" width="240" height="111" rx="10" fill="#07101f"/>
    <rect x="865" y="348" width="80" height="28" rx="8" fill="#3b82f6"/>
    <rect x="825" y="376" width="160" height="18" rx="9" fill="#3d4f72"/>
    <rect x="958" y="402" width="122" height="34" rx="17" fill="#22c55e"/>
    <text x="984" y="426" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#052e16">Online</text>
  </g>
</svg>
